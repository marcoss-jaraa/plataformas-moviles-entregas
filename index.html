<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.H.I.E.L.D. HQ — Plataformas Móviles: Misiones</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Roboto', sans-serif; }
        
        /* Contenedor principal para el renderizado 3D (ocupa toda la pantalla) */
        #three-container { width: 100vw; height: 100vh; display: block; }

        /* Estilos de la interfaz HUD superpuesta */
        .hud-overlay { position: absolute; pointer-events: none; }
        
        .header { top: 20px; left: 20px; text-align: left; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 20px; margin: 0; color: #00d2ff; letter-spacing: 2px; text-shadow: 0 0 10px #00d2ff; }
        .header p { font-size: 10px; margin: 5px 0; color: #888; }

        .footer { bottom: 20px; width: 100%; text-align: center; }
        .footer span { font-size: 9px; color: #555; letter-spacing: 1px; }

        /* Panel lateral dinámico que aparece al hacer hover en un TP */
        #data-panel {
            position: absolute; top: 100px; right: -300px; /* Oculto a la derecha */
            width: 250px; padding: 20px;
            background: rgba(0, 10, 20, 0.85);
            border: 1px solid #00d2ff; border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            pointer-events: auto; /* Permite clicks */
            transition: right 0.4s ease; /* Animación de entrada/salida */
            z-index: 100;
        }
        #data-panel.active { right: 20px; } /* Clase para mostrarlo */
        
        #data-panel h2 { font-family: 'Orbitron', sans-serif; color: #00d2ff; margin-top: 0; font-size: 16px; border-bottom: 1px solid #00d2ff; padding-bottom: 10px; }
        #data-panel p { color: #ccc; font-size: 12px; line-height: 1.5; }
        #data-panel .tag { display: inline-block; padding: 3px 8px; border-radius: 2px; font-size: 9px; font-weight: bold; background: rgba(0,210,255,0.1); color: #00d2ff; margin-bottom: 10px;}
        #btn-go {
            display: block; width: 100%; padding: 10px; margin-top: 15px;
            background: transparent; border: 1px solid #00d2ff; color: #00d2ff;
            font-family: 'Orbitron', sans-serif; font-size: 12px; cursor: pointer;
            transition: background 0.3s ease; text-decoration: none; text-align: center;
        }
        #btn-go:hover { background: #00d2ff; color: #000; }

    </style>
</head>
<body>

    <div class="hud-overlay header">
        <h1>S.H.I.E.L.D. ACCESS PROTOCOL</h1>
        <p>ACTIVE MISSION LOG :: AVENGERS INITIATIVE PART: PLATAFORMAS MÓVILES</p>
    </div>

    <div id="data-panel">
        <span class="tag" id="tp-tag">HTML</span>
        <h2 id="tp-title">MISIÓN 01</h2>
        <p id="tp-desc">Análisis y estructura base de datos. Protocolo HTML inicial.</p>
        <a href="#" id="btn-go" target="_blank">INICIAR MISIÓN</a>
    </div>

    <div class="hud-overlay footer">
        <span>"Avenge the fallen." — PROYECTO ACADÉMICO. 2026.</span>
    </div>

    <canvas id="three-container"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"></script>

    <script type="module">
        // Importamos módulos adicionales necesarios para la interacción
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        /* ════════════════════════════════════════════════
           DATA DE LAS MISIONES (TRABAJOS PRÁCTICOS)
        ════════════════════════════════════════════════ */
        const missions = [
            {n:'01', name:'Primer Trabajo', tag:'HTML', href:'tp-1/', desc:'Estructura básica del sitio.', color:'#ff9f43'},
            {n:'02', name:'Selectores CSS', tag:'CSS',  href:'tp-2/', desc:'Estilado fundamental de elementos.', color:'#54a0ff'},
            {n:'03', name:'Especificidad',  tag:'CSS',  href:'tp-3/', desc:'Jerarquía y cascada de estilos.', color:'#54a0ff'},
            {n:'04', name:'Media Queries',  tag:'CSS',  href:'tp-4/', desc:'Diseño responsivo para móviles.', color:'#54a0ff'},
            {n:'05', name:'Bootstrap Base', tag:'BOOT', href:'tp-5/', desc:'Uso elemental del framework.', color:'#a55eed'},
            {n:'06', name:'Grilla Boot',    tag:'BOOT', href:'tp-6/', desc:'Maquetación responsiva avanzada.', color:'#a55eed'},
            {n:'07', name:'Bootstrap (2)',  tag:'BOOT', href:'tp-7/', desc:'Integración profunda de componentes.', color:'#a55eed'},
            {n:'08', name:'Funciones JS',   tag:'JS',   href:'tp-8/', desc:'Programación funcional básica.', color:'#feca57'},
            {n:'09', name:'Listas JS',      tag:'JS',   href:'tp-9/', desc:'Manejo de arrays y bucles.', color:'#feca57'},
            {n:'10', name:'Objetos JS',     tag:'JS',   href:'tp-10/', href:'tp-10/', desc:'Estructuras de datos complejas.', color:'#feca57'},
            {n:'11', name:'Listas y Obj',   tag:'JS',   href:'tp-11/', desc:'Manipulación DOM avanzada.', color:'#feca57'},
            {n:'12', name:'Trabajo 12',     tag:'JS',   href:'tp-12/', desc:'Módulo de Lógica Avanzada.', color:'#feca57'},
            {n:'13', name:'Trabajo 13',     tag:'JS',   href:'tp-13/', desc:'Persistencia de Datos.', color:'#feca57'},
            {n:'14', name:'Trabajo 14',     tag:'JS',   href:'tp-14/', desc:'Integración de APIs.', color:'#feca57'},
            {n:'15', name:'Trabajo 15',     tag:'JS',   href:'tp-15/', desc:'Control de flujo de datos.', color:'#feca57'},
            {n:'16', name:'Trabajo 16',     tag:'PHP',  href:'tp-16/', desc:'Introducción al Backend.', color:'#ff6b6b'}
        ];

        /* ════════════════════════════════════════════════
           CONFIGURACIÓN BASE DE THREE.JS (ESCENA CENTRAL)
        ════════════════════════════════════════════════ */
        let scene, camera, renderer, controls, raycaster, mouse;
        let missionOrbs = []; // Array para guardar las mallas 3D de los TPs
        let hoveredOrb = null; // Guardar el orbe sobre el que está el mouse

        function init() {
            // 1. La Escena (El "mundo" 3D)
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x00050a); // Fondo azul oscurísimo Stark
            // Niebla para dar profundidad
            scene.fog = new THREE.FogExp2(0x00050a, 0.05);

            // 2. La Cámara (Nuestra "vista")
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 25); // Posición inicial (arriba y atrás)

            // 3. El Renderizador (Dibuja la escena en el canvas HTML)
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-container'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // 4. Controles (Permite mover la cámara con el mouse)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true; // Movimiento suave
            controls.dampingFactor = 0.05;
            controls.minDistance = 5; // Zoom mínimo
            controls.maxDistance = 50; // Zoom máximo
            controls.maxPolarAngle = Math.PI / 2; // No bajar de la mesa

            // 5. Luces (Sin luces, todo es negro)
            const ambientLight = new THREE.AmbientLight(0x112233); // Luz de ambiente suave
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1); // Luz como el sol
            directionalLight.position.set(5, 10, 7.5);
            scene.add(directionalLight);

            // Luz puntual azul en el centro para el efecto holograma
            const pointLight = new THREE.PointLight(0x00d2ff, 2, 50);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // 6. Raycaster y Mouse (Para detectar clicks/hovers en 3D)
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // ════ CONSTRUCCIÓN DE OBJETOS 3D ════
            createWarTable();
            createMissionOrbs();
            createAvengersIcons();

            // Eventos
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onMouseClick, false);

            animate(); // Iniciar loop de renderizado
        }

        /* ════════════════════════════════════════════════
           CREACIÓN DE OBJETOS GEOMÉTRICOS 3D
        ════════════════════════════════════════════════ */

        // Crea la "Mesa de Guerra" base
        function createWarTable() {
            // Geometría: Cilindro chato
            const tableGeometry = new THREE.CylinderGeometry(15, 15, 1, 64);
            // Material: Metal oscuro brillante
            const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.2 });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.y = -0.5; // Bajarla un poco
            scene.add(table);

            // Grilla holográfica azul sobre la mesa
            const gridHelper = new THREE.GridHelper(28, 28, 0x00d2ff, 0x003344);
            gridHelper.position.y = 0.01; // Justo encima
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
        }

        // Crea los orbes flotantes de las misiones (TPs)
        function createMissionOrbs() {
            // Geometría común: Icosaedro (parece una esfera tallada, muy tech)
            const geometry = new THREE.IcosahedronGeometry(1, 1);
            
            missions.forEach((mission, i) => {
                // Material común: Transparente y emisivo (brilla)
                const material = new THREE.MeshStandardMaterial({
                    color: mission.color,
                    emissive: mission.color, // Color del brillo
                    emissiveIntensity: 1, // Intensidad inicial
                    transparent: true,
                    opacity: 0.7,
                    wireframe: true // Estilo "red de alambre" holográfico
                });
                const orb = new THREE.Mesh(geometry, material);

                // POSICIONAMIENTO MATEMÁTICO 3D
                // Usamos seno y coseno para distribuirlos en espiral flotando sobre la mesa
                const angle = i * (Math.PI * 2 / missions.length) * 1.2; // Ángulo
                const radius = 6 + (i * 0.4); // Radio creciente (espiral)
                orb.position.x = Math.cos(angle) * radius;
                orb.position.z = Math.sin(angle) * radius;
                orb.position.y = 3 + Math.sin(angle * 2) * 1.5; // Altura variable (onda)

                // Guardar la data de la misión dentro del objeto 3D
                orb.userData = { missionData: mission, originalY: orb.position.y, angleOffset: angle };
                
                missionOrbs.push(orb);
                scene.add(orb);
            });
        }

        // Crea íconos abstractos de los Vengadores para decorar
        function createAvengersIcons() {
            // Ícono CAPITÁN AMÉRICA (Escudo Geométrico)
            const capGroup = new THREE.Group();
            const diskGeom = new THREE.CylinderGeometry(3, 3, 0.2, 32);
            const redMat = new THREE.MeshStandardMaterial({ color: 0xaa0000 });
            const blueMat = new THREE.MeshStandardMaterial({ color: 0x0000aa });
            const disk1 = new THREE.Mesh(diskGeom, redMat);
            const disk2 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.21, 32), blueMat);
            capGroup.add(disk1, disk2);
            capGroup.rotation.x = Math.PI / 2; // Girar vertical
            capGroup.position.set(-18, 5, -5);
            scene.add(capGroup);

            // Ícono IRON MAN (Arc Reactor Geométrico)
            const arcReactor = new THREE.Mesh(
                new THREE.TorusGeometry(2, 0.2, 8, 24),
                new THREE.MeshStandardMaterial({ color: 0x00d2ff, emissive: 0x00d2ff, emissiveIntensity: 2 })
            );
            arcReactor.position.set(15, 6, 12);
            scene.add(arcReactor);
        }

        /* ════════════════════════════════════════════════
           LÓGICA DE INTERACCIÓN (MOUSE)
        ════════════════════════════════════════════════ */

        const dataPanel = document.getElementById('data-panel');
        const tpTitle = document.getElementById('tp-title');
        const tpDesc = document.getElementById('tp-desc');
        const tpTag = document.getElementById('tp-tag');
        const btnGo = document.getElementById('btn-go');

        function onMouseMove(event) {
            // Convertir coordenadas de mouse 2D a coordenadas normalizadas 3D (-1 a +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseClick() {
            // Si hay un orbe bajo el mouse, abrir el link
            if (hoveredOrb) {
                window.open(hoveredOrb.userData.missionData.href, '_blank');
            }
        }

        /* ════════════════════════════════════════════════
           LOOP DE ANIMACIÓN Y RENDERIZADO (CORE)
        ════════════════════════════════════════════════ */
        
        const clock = new THREE.Clock(); // Medir el tiempo para animaciones constantes

        function animate() {
            requestAnimationFrame(animate); // Llamar a esta función en el próximo frame

            const elapsedTime = clock.getElapsedTime(); // Tiempo total transcurrido

            // 1. Actualizar controles de cámara
            controls.update();

            // 2. Animación de los orbes (Hacerlos flotar y rotar)
            missionOrbs.forEach((orb) => {
                orb.rotation.y += 0.01; // Rotación sobre eje Y
                orb.rotation.x += 0.005; // Rotación sobre eje X

                // Efecto flotante usando Seno (oscilación)
                const data = orb.userData;
                orb.position.y = data.originalY + Math.sin(elapsedTime * 2 + data.angleOffset) * 0.5;
            });

            // 3. Lógica de Raycasting (Detección de Mouse/Hover)
            raycaster.setFromCamera(mouse, camera); // Actualizar rayo desde la cámara
            const intersects = raycaster.intersectObjects(missionOrbs); // Buscar intersecciones

            if (intersects.length > 0) {
                // El orbe más cercano bajo el mouse
                const firstObject = intersects[0].object;

                if (hoveredOrb !== firstObject) {
                    // SI ACABAMOS DE ENTRAR A UN NUEVO ORBE
                    if (hoveredOrb) resetOrbEffects(hoveredOrb); // Resetear anterior

                    hoveredOrb = firstObject;
                    applyOrbHoverEffects(hoveredOrb);
                }
            } else {
                // SI EL MOUSE NO ESTÁ SOBRE NINGÚN ORBE
                if (hoveredOrb) {
                    resetOrbEffects(hoveredOrb);
                    hoveredOrb = null;
                }
            }

            // 4. Renderizar la escena final
            renderer.render(scene, camera);
        }

        // Efectos al pasar el mouse por encima del orbe
        function applyOrbHoverEffects(orb) {
            orb.material.wireframe = false; // Pasar a sólido
            orb.material.emissiveIntensity = 3; // Brillo máximo
            orb.scale.set(1.2, 1.2, 1.2); // Agrandar

            // Actualizar y Mostrar panel de datos UI
            const data = orb.userData.missionData;
            tpTitle.textContent = `TP ${data.n} - ${data.name.toUpperCase()}`;
            tpDesc.textContent = data.desc;
            tpTag.textContent = data.tag;
            tpTag.style.color = data.color;
            tpTag.style.border = `1px solid ${data.color}`;
            btnGo.href = data.href;
            dataPanel.classList.add('active'); // Mostrar panel
        }

        // Resetear efectos originales del orbe
        function resetOrbEffects(orb) {
            orb.material.wireframe = true;
            orb.material.emissiveIntensity = 1;
            orb.scale.set(1, 1, 1);
            dataPanel.classList.remove('active'); // Ocultar panel
        }

        // Manejar redimensionamiento de ventana
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init(); // Arrancar todo

    </script>
</body>
</html>
