<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Westeros Repository — Trabajos Prácticos</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #050505; 
            color: #d4af37; /* Dorado */
            font-family: 'Cormorant Garamond', serif; 
        }
        
        /* Contenedor principal para el renderizado 3D */
        #three-container { width: 100vw; height: 100vh; display: block; }

        /* Interfaz superpuesta (HUD) */
        .hud-overlay { position: absolute; pointer-events: none; z-index: 10; }
        
        .header { top: 30px; left: 30px; text-align: left; }
        .header h1 { 
            font-family: 'Cinzel', serif; 
            font-size: 24px; 
            margin: 0; 
            color: #d4af37; 
            letter-spacing: 3px; 
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); 
        }
        .header p { font-size: 14px; margin: 5px 0; color: #a0a0a0; font-style: italic; letter-spacing: 1px; }

        .footer { bottom: 20px; width: 100%; text-align: center; }
        .footer span { font-size: 12px; color: #777; letter-spacing: 2px; font-family: 'Cinzel', serif;}

        /* Panel lateral dinámico (El Estandarte) */
        #data-panel {
            position: absolute; top: 50%; right: -350px; 
            transform: translateY(-50%);
            width: 280px; padding: 30px;
            background: linear-gradient(135deg, rgba(20, 5, 5, 0.95), rgba(10, 10, 10, 0.95));
            border: 1px solid #d4af37; 
            border-left: 4px solid #8b0000; /* Rojo sangre */
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(212, 175, 55, 0.1);
            pointer-events: auto; 
            transition: right 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 100;
        }
        #data-panel.active { right: 30px; }
        
        #data-panel h2 { 
            font-family: 'Cinzel', serif; 
            color: #d4af37; 
            margin-top: 0; 
            font-size: 20px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.3); 
            padding-bottom: 10px; 
            letter-spacing: 1px;
        }
        #data-panel p { color: #cccccc; font-size: 16px; line-height: 1.6; }
        
        #data-panel .tag { 
            display: inline-block; padding: 4px 10px; font-family: 'Cinzel', serif; 
            font-size: 11px; font-weight: bold; background: rgba(139, 0, 0, 0.2); 
            color: #ff4444; border: 1px solid #8b0000; margin-bottom: 15px; letter-spacing: 1px;
        }

        #btn-go {
            display: block; width: 100%; padding: 12px; margin-top: 25px;
            background: transparent; border: 1px solid #d4af37; color: #d4af37;
            font-family: 'Cinzel', serif; font-size: 14px; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; text-decoration: none; text-align: center; box-sizing: border-box;
        }
        #btn-go:hover { background: rgba(212, 175, 55, 0.2); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

        /* Efecto de cargando */
        #loading {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #d4af37; display: flex; justify-content: center; align-items: center;
            font-family: 'Cinzel', serif; font-size: 24px; z-index: 999; letter-spacing: 4px;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

    <div id="loading">Forjando el Reino...</div>

    <div class="hud-overlay header">
        <h1>ARCHIVOS DE LA CIUDADELA</h1>
        <p>Tomos Académicos :: Lenguaje C y Estructuras</p>
    </div>

    <div id="data-panel">
        <span class="tag" id="tp-tag">C / LENGUAJE</span>
        <h2 id="tp-title">TOMO 01</h2>
        <p id="tp-desc">Descripción del archivo y los misterios que alberga en su interior.</p>
        <a href="#" id="btn-go" target="_blank">ABRIR TOMO</a>
    </div>

    <div class="hud-overlay footer">
        <span>"Winter is coming." — Ciclo Lectivo 2026</span>
    </div>

    <canvas id="three-container"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        /* ════════════════════════════════════════════════
           DATOS DE LOS TRABAJOS (INSPIRADOS EN LAS CASAS)
        ════════════════════════════════════════════════ */
        const missions = [
            {n:'01', name:'Fundamentos', tag:'C / LÓGICA', href:'tp-1/', desc:'Introducción a la programación en C. El invierno se acerca, y hay que preparar la lógica base.', color:'#ffffff'},
            {n:'02', name:'Structs Simples', tag:'C / DATOS',  href:'tp-2/', desc:'Agrupación de datos en estructuras. Un Lannister siempre ordena sus variables.', color:'#d4af37'},
            {n:'03', name:'Estructuras Anidadas',  tag:'C / DOBLE STRUCT',  href:'tp-3/', desc:'Structs dentro de structs (ej: Alumno y Materia). Sangre y Fuego en la gestión de memoria.', color:'#8b0000'},
            {n:'04', name:'UI de Consola',  tag:'C / GOTOXY',  href:'tp-4/', desc:'Manejo de coordenadas en pantalla usando gotoxy. Nuestra es la furia visual.', color:'#b8860b'}
        ];

        /* ════════════════════════════════════════════════
           CONFIGURACIÓN BASE DE THREE.JS
        ════════════════════════════════════════════════ */
        let scene, camera, renderer, controls, raycaster, mouse;
        let missionOrbs = []; 
        let hoveredOrb = null; 
        let astrolabeRings = []; // Anillos de la intro
        let embers; // Partículas de fuego

        function init() {
            // Escena Oscura
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0505); 
            scene.fog = new THREE.FogExp2(0x0a0505, 0.04); // Niebla oscura

            // Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30); 

            // Renderizador
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-container'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // Colores más cinemáticos
            renderer.toneMappingExposure = 1.2;

            // Controles
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 1.8; 

            // Luces (Fuego y Oro)
            const ambientLight = new THREE.AmbientLight(0x221111); 
            scene.add(ambientLight);

            const fireLight = new THREE.PointLight(0xff4400, 500, 100);
            fireLight.position.set(0, 0, 0);
            scene.add(fireLight);

            const goldLight = new THREE.DirectionalLight(0xffdd88, 2);
            goldLight.position.set(10, 20, 10);
            scene.add(goldLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Construcción
            createAstrolabe();
            createMissionEggs();
            createEmbers();

            // Quitar pantalla de carga
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
            }, 1000);

            // Eventos
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('click', onMouseClick, false);

            animate(); 
        }

        /* ════════════════════════════════════════════════
           CREACIÓN DE OBJETOS GEOMÉTRICOS 3D (GoT STYLE)
        ════════════════════════════════════════════════ */

        function createAstrolabe() {
            const material = new THREE.MeshStandardMaterial({ 
                color: 0xd4af37, 
                metalness: 0.8, 
                roughness: 0.3,
                emissive: 0x221100
            });

            // Crear 3 anillos concéntricos rotatorios
            for(let i=0; i<3; i++) {
                const geometry = new THREE.TorusGeometry(5 + (i * 1.5), 0.15, 16, 100);
                const ring = new THREE.Mesh(geometry, material);
                // Inclinaciones iniciales aleatorias
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                
                // Velocidad de rotación personalizada
                ring.userData = {
                    speedX: (Math.random() - 0.5) * 0.01,
                    speedY: (Math.random() - 0.5) * 0.01,
                    speedZ: (Math.random() - 0.5) * 0.01
                };
                
                astrolabeRings.push(ring);
                scene.add(ring);
            }

            // Esfera central (El Sol / Centro del mundo)
            const sunGeo = new THREE.SphereGeometry(2, 32, 32);
            const sunMat = new THREE.MeshStandardMaterial({
                color: 0xff4400,
                emissive: 0xff2200,
                emissiveIntensity: 2,
                wireframe: true
            });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sun);
        }

        // Crea esferas representando "Huevos de Dragón" o tomos
        function createMissionEggs() {
            const geometry = new THREE.SphereGeometry(1.2, 32, 32);
            
            missions.forEach((mission, i) => {
                const material = new THREE.MeshStandardMaterial({
                    color: mission.color,
                    metalness: 0.6,
                    roughness: 0.2,
                    emissive: mission.color,
                    emissiveIntensity: 0.2
                });
                const egg = new THREE.Mesh(geometry, material);

                // Posicionar en círculo alrededor del astrolabio
                const angle = (i / missions.length) * Math.PI * 2;
                const radius = 12;
                egg.position.x = Math.cos(angle) * radius;
                egg.position.z = Math.sin(angle) * radius;
                egg.position.y = 0; 

                egg.userData = { missionData: mission, originalY: 0, angleOffset: angle };
                
                missionOrbs.push(egg);
                scene.add(egg);
            });
        }

        // Sistema de partículas para simular fuego/cenizas flotando
        function createEmbers() {
            const particleCount = 1000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i++) {
                // Distribuir en un área amplia
                positions[i] = (Math.random() - 0.5) * 60; 
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0xffaa00,
                size: 0.15,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            embers = new THREE.Points(geometry, material);
            scene.add(embers);
        }

        /* ════════════════════════════════════════════════
           LÓGICA DE INTERACCIÓN Y UI
        ════════════════════════════════════════════════ */

        const dataPanel = document.getElementById('data-panel');
        const tpTitle = document.getElementById('tp-title');
        const tpDesc = document.getElementById('tp-desc');
        const tpTag = document.getElementById('tp-tag');
        const btnGo = document.getElementById('btn-go');

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseClick() {
            if (hoveredOrb) {
                window.open(hoveredOrb.userData.missionData.href, '_blank');
            }
        }

        /* ════════════════════════════════════════════════
           LOOP DE ANIMACIÓN (CORE)
        ════════════════════════════════════════════════ */
        
        const clock = new THREE.Clock(); 

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime(); 

            controls.update();

            // Animar el astrolabio central
            astrolabeRings.forEach(ring => {
                ring.rotation.x += ring.userData.speedX;
                ring.rotation.y += ring.userData.speedY;
                ring.rotation.z += ring.userData.speedZ;
            });

            // Animar las cenizas flotando hacia arriba
            const positions = embers.geometry.attributes.position.array;
            for (let i = 1; i < positions.length; i += 3) {
                positions[i] += 0.05; // Suben en el eje Y
                if (positions[i] > 30) {
                    positions[i] = -30; // Si suben mucho, reaparecen abajo
                }
            }
            embers.geometry.attributes.position.needsUpdate = true;

            // Animar los "tomos" / huevos
            missionOrbs.forEach((orb) => {
                orb.rotation.y += 0.005; 
                const data = orb.userData;
                // Efecto flotante
                orb.position.y = data.originalY + Math.sin(elapsedTime * 1.5 + data.angleOffset) * 1.5;
            });

            // Lógica de Raycasting
            raycaster.setFromCamera(mouse, camera); 
            const intersects = raycaster.intersectObjects(missionOrbs); 

            if (intersects.length > 0) {
                const firstObject = intersects[0].object;
                document.body.style.cursor = 'pointer';

                if (hoveredOrb !== firstObject) {
                    if (hoveredOrb) resetOrbEffects(hoveredOrb); 
                    hoveredOrb = firstObject;
                    applyOrbHoverEffects(hoveredOrb);
                }
            } else {
                document.body.style.cursor = 'default';
                if (hoveredOrb) {
                    resetOrbEffects(hoveredOrb);
                    hoveredOrb = null;
                }
            }

            renderer.render(scene, camera);
        }

        function applyOrbHoverEffects(orb) {
            orb.material.emissiveIntensity = 0.8; 
            orb.scale.set(1.2, 1.2, 1.2); 

            // Actualizar UI
            const data = orb.userData.missionData;
            tpTitle.textContent = `TOMO ${data.n} - ${data.name.toUpperCase()}`;
            tpDesc.textContent = data.desc;
            tpTag.textContent = data.tag;
            
            // Adaptar colores del tag
            let tagColor = '#8b0000'; // Default rojo
            if(data.color === '#d4af37' || data.color === '#b8860b') tagColor = '#b8860b'; // Dorado
            if(data.color === '#ffffff') tagColor = '#aaaaaa'; // Gris/Blanco
            
            tpTag.style.color = tagColor;
            tpTag.style.borderColor = tagColor;
            tpTag.style.backgroundColor = `${tagColor}22`; // Color con transparencia

            btnGo.href = data.href;
            dataPanel.classList.add('active'); 
        }

        function resetOrbEffects(orb) {
            orb.material.emissiveIntensity = 0.2;
            orb.scale.set(1, 1, 1);
            dataPanel.classList.remove('active'); 
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init(); 

    </script>
</body>
</html>
