<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body class="bg-light">
    <main class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Tablero de Puntos</h1>

        <section class="card shadow-sm">
            <div class="card-body p-3 p-md-4">
                <div class="row text-center align-items-center">
                    <div class="col-5">
                        <span id="puntosLocal" class="display-1 text-primary">0</span>
                        <p id="nombreLocal" class="m-0 fw-semibold">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1 text-secondary">:</span>
                    </div>
                    <div class="col-5">
                        <span id="puntosVisitante" class="display-1 text-success">0</span>
                        <p id="nombreVisitante" class="m-0 fw-semibold">Visitante</p>
                    </div>
                </div>

                <p id="estadoPartido" class="text-center text-success fw-semibold mt-3 mb-0">Partido en juego</p>

                <hr>

                <h2 class="h4">Actualizar contador</h2>
                <div class="row">
                    <div class="col-12 col-sm-6 my-1">
                        <button type="button" class="btn d-block w-100 btn-primary" data-puntaje="local" data-cambio="1">+ Punto Local</button>
                    </div>
                    <div class="col-12 col-sm-6 my-1">
                        <button type="button" class="btn d-block w-100 btn-outline-primary" data-puntaje="local" data-cambio="-1">- Punto Local</button>
                    </div>
                    <div class="col-12 col-sm-6 my-1">
                        <button type="button" class="btn d-block w-100 btn-success" data-puntaje="visitante" data-cambio="1">+ Punto Visitante</button>
                    </div>
                    <div class="col-12 col-sm-6 my-1">
                        <button type="button" class="btn d-block w-100 btn-outline-success" data-puntaje="visitante" data-cambio="-1">- Punto Visitante</button>
                    </div>
                </div>

                <div class="row mt-3">
                    <div class="col-12 col-sm-4 my-1">
                        <button type="button" id="invertir" class="btn d-block w-100 btn-warning">Invertir puntaje</button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button type="button" id="finalizar" class="btn d-block w-100 btn-dark">Finalizar partido</button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button type="button" id="reiniciar" class="btn d-block w-100 btn-danger">Reiniciar</button>
                    </div>
                </div>

                <hr>

                <h2 class="h4">Personalización</h2>
                <div class="row">
                    <div class="col-12 col-md-6 my-1">
                        <label for="inputNombreLocal" class="form-label">Nombre del local</label>
                        <input type="text" id="inputNombreLocal" class="form-control" value="Local" maxlength="20">
                    </div>
                    <div class="col-12 col-md-6 my-1">
                        <label for="inputNombreVisitante" class="form-label">Nombre del visitante</label>
                        <input type="text" id="inputNombreVisitante" class="form-control" value="Visitante" maxlength="20">
                    </div>
                    <div class="col-12 col-md-6 my-1">
                        <label for="colorLocal" class="form-label">Color del local</label>
                        <input type="color" id="colorLocal" class="form-control form-control-color" value="#0d6efd">
                    </div>
                    <div class="col-12 col-md-6 my-1">
                        <label for="colorVisitante" class="form-label">Color del visitante</label>
                        <input type="color" id="colorVisitante" class="form-control form-control-color" value="#198754">
                    </div>
                </div>

                <p class="text-secondary small mb-0 mt-3">Atajos: Q suma local, A resta local, P suma visitante y L resta visitante.</p>
            </div>
        </section>
    </main>

    <script>
        let puntosLocal = 0;
        let puntosVisitante = 0;
        let partidoFinalizado = false;

        const elementoPuntosLocal = document.querySelector('#puntosLocal');
        const elementoPuntosVisitante = document.querySelector('#puntosVisitante');
        const elementoNombreLocal = document.querySelector('#nombreLocal');
        const elementoNombreVisitante = document.querySelector('#nombreVisitante');
        const elementoEstado = document.querySelector('#estadoPartido');
        const botonesPuntaje = document.querySelectorAll('[data-puntaje]');
        const inputNombreLocal = document.querySelector('#inputNombreLocal');
        const inputNombreVisitante = document.querySelector('#inputNombreVisitante');
        const inputColorLocal = document.querySelector('#colorLocal');
        const inputColorVisitante = document.querySelector('#colorVisitante');

        function actualizarTablero() {
            elementoPuntosLocal.textContent = puntosLocal;
            elementoPuntosVisitante.textContent = puntosVisitante;
            botonesPuntaje.forEach(function (boton) {
                boton.disabled = partidoFinalizado;
            });

            if (partidoFinalizado) {
                elementoEstado.textContent = 'Partido finalizado';
                elementoEstado.className = 'text-center text-danger fw-semibold mt-3 mb-0';
            } else {
                elementoEstado.textContent = 'Partido en juego';
                elementoEstado.className = 'text-center text-success fw-semibold mt-3 mb-0';
            }
        }

        function cambiarPuntaje(equipo, cambio) {
            if (partidoFinalizado) {
                return;
            }

            if (equipo === 'local') {
                puntosLocal = Math.max(0, puntosLocal + cambio);
            } else {
                puntosVisitante = Math.max(0, puntosVisitante + cambio);
            }

            actualizarTablero();
        }

        botonesPuntaje.forEach(function (boton) {
            boton.addEventListener('click', function () {
                cambiarPuntaje(boton.dataset.puntaje, Number(boton.dataset.cambio));
            });
        });

        document.querySelector('#invertir').addEventListener('click', function () {
            const puntajeTemporal = puntosLocal;
            puntosLocal = puntosVisitante;
            puntosVisitante = puntajeTemporal;
            actualizarTablero();
        });

        document.querySelector('#finalizar').addEventListener('click', function () {
            partidoFinalizado = true;
            actualizarTablero();
        });

        document.querySelector('#reiniciar').addEventListener('click', function () {
            puntosLocal = 0;
            puntosVisitante = 0;
            partidoFinalizado = false;
            actualizarTablero();
        });

        inputNombreLocal.addEventListener('input', function () {
            elementoNombreLocal.textContent = inputNombreLocal.value.trim() || 'Local';
        });

        inputNombreVisitante.addEventListener('input', function () {
            elementoNombreVisitante.textContent = inputNombreVisitante.value.trim() || 'Visitante';
        });

        inputColorLocal.addEventListener('input', function () {
            elementoPuntosLocal.style.color = inputColorLocal.value;
        });

        inputColorVisitante.addEventListener('input', function () {
            elementoPuntosVisitante.style.color = inputColorVisitante.value;
        });

        document.addEventListener('keydown', function (evento) {
            const etiquetaActiva = document.activeElement.tagName;

            if (etiquetaActiva === 'INPUT' || etiquetaActiva === 'TEXTAREA') {
                return;
            }

            if (evento.key.toLowerCase() === 'q') {
                cambiarPuntaje('local', 1);
            } else if (evento.key.toLowerCase() === 'a') {
                cambiarPuntaje('local', -1);
            } else if (evento.key.toLowerCase() === 'p') {
                cambiarPuntaje('visitante', 1);
            } else if (evento.key.toLowerCase() === 'l') {
                cambiarPuntaje('visitante', -1);
            }
        });
    </script>
</body>
</html>
