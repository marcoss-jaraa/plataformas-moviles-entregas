<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - TP 16</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="bg-danger text-white py-4 shadow-sm">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-1">Pokédex</h1>
            <p class="mb-0">Los primeros 151 Pokémon y mucho más</p>
        </div>
    </header>

    <main class="container py-4">
        <div id="spinner" class="text-center py-5">
            <div class="spinner-border text-danger" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-3 mb-0">Cargando Pokémon...</p>
        </div>

        <div id="pokemon-container" class="row g-4"></div>

        <div class="text-center mt-5">
            <button id="btn-cargar-mas" class="btn btn-danger btn-lg px-4" type="button">
                Cargar más Pokémon
            </button>
        </div>
    </main>

    <div class="modal fade" id="pokemonModal" tabindex="-1" aria-labelledby="pokemonModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h2 class="modal-title fs-4" id="pokemonModalLabel">Información del Pokémon</h2>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
