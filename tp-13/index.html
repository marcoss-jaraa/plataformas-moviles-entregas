<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>

        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>

                <ul id="lista-productos" class="list-group mb-3"></ul>

                <div class="row">
                    <div class="col-12 col-md-6 mb-2">
                        <button id="btn-ordenar" class="btn btn-success w-100">
                            Ordenar Productos
                        </button>
                    </div>

                    <div class="col-12 col-md-6 mb-2">
                        <button id="btn-limpiar" class="btn btn-danger w-100">
                            Limpiar Lista
                        </button>
                    </div>
                </div>

                <hr class="hr">

                <h2>Agregar Producto</h2>

                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input
                            type="text"
                            class="form-control"
                            aria-label="Nombre del Producto"
                            placeholder="Nombre del producto"
                        >

                        <button class="btn btn-primary" type="submit">
                            Agregar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">
        const listaProductos = document.getElementById('lista-productos');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const btnOrdenar = document.getElementById('btn-ordenar');

        let productos = [];

        function guardarProductos() {
            localStorage.setItem('productos', JSON.stringify(productos));
        }

        function cargarProductos() {
            const productosGuardados = localStorage.getItem('productos');

            if (productosGuardados) {
                productos = JSON.parse(productosGuardados);
            } else {
                productos = [
                    {
                        nombre: 'Pan',
                        comprado: false
                    }
                ];
            }

            mostrarProductos();
        }

        function mostrarProductos() {
            listaProductos.innerHTML = '';

            productos.forEach(function(producto, indice) {
                const li = document.createElement('li');

                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                const nombre = document.createElement('span');

                nombre.textContent = producto.nombre;
                nombre.style.cursor = 'pointer';

                if (producto.comprado) {
                    nombre.style.textDecoration = 'line-through';
                } else {
                    nombre.style.textDecoration = 'none';
                }

                nombre.addEventListener('click', function() {
                    marcarComprado(indice);
                });

                const botones = document.createElement('div');

                const btnEditar = document.createElement('button');

                btnEditar.textContent = 'Editar';
                btnEditar.className = 'btn btn-warning btn-sm me-2';

                btnEditar.addEventListener('click', function() {
                    editarProducto(indice);
                });

                const btnEliminar = document.createElement('button');

                btnEliminar.textContent = 'Eliminar';
                btnEliminar.className = 'btn btn-danger btn-sm';

                btnEliminar.addEventListener('click', function() {
                    eliminarProducto(indice);
                });

                botones.appendChild(btnEditar);
                botones.appendChild(btnEliminar);

                li.appendChild(nombre);
                li.appendChild(botones);

                listaProductos.appendChild(li);
            });
        }

        function agregarProducto(nombreProducto) {
            nombreProducto = nombreProducto.trim();

            if (nombreProducto !== '') {
                productos.push({
                    nombre: nombreProducto,
                    comprado: false
                });

                guardarProductos();
                mostrarProductos();
            }
        }

        function eliminarProducto(indice) {
            productos.splice(indice, 1);

            guardarProductos();
            mostrarProductos();
        }

        function editarProducto(indice) {
            const nuevoNombre = prompt(
                'Ingrese el nuevo nombre del producto:',
                productos[indice].nombre
            );

            if (nuevoNombre !== null && nuevoNombre.trim() !== '') {
                productos[indice].nombre = nuevoNombre.trim();

                guardarProductos();
                mostrarProductos();
            }
        }

        function marcarComprado(indice) {
            productos[indice].comprado = !productos[indice].comprado;

            guardarProductos();
            mostrarProductos();
        }

        function limpiarLista() {
            productos = [];

            guardarProductos();
            mostrarProductos();
        }

        function ordenarProductos() {
            productos.sort(function(a, b) {
                return a.nombre.localeCompare(b.nombre);
            });

            guardarProductos();
            mostrarProductos();
        }

        function handlerFormulario(evento) {
            evento.preventDefault();

            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;

            input.value = '';

            agregarProducto(nombreProducto);
        }

        document.querySelector('form').addEventListener('submit', handlerFormulario);

        btnLimpiar.addEventListener('click', limpiarLista);

        btnOrdenar.addEventListener('click', ordenarProductos);

        cargarProductos();
    </script>
</body>
</html>
